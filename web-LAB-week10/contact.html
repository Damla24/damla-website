<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İletişim | Damla Kayıkcı</title>
  <link rel="stylesheet" href="homepage.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><img src="resimler/bunu_daha_çok_beğendim_bunu_b3e963bf_2K.jpg" alt="" width="38" height="38">Damla Kayıkcı</a>
      <nav aria-label="Ana menü">
        <a href="index.html">Ana Sayfa</a>
        <a href="galery.html">Galeri</a>
        <a href="contact.html" aria-current="page">İletişim</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="intro">
      <h1>İletişim</h1>
      <p>Bir proje ya da fikir hakkında konuşmak istersen bana e-posta yazabilirsin.</p>
    </div>
    <div class="contact-layout">
      <form class="panel" id="contact-form">
        <h2>Mesaj yaz</h2>
        <p>Düğme, mesajını e-posta uygulamanda taslak olarak açar.</p>
        <label for="name">Ad soyad</label>
        <input id="name" name="name" autocomplete="name" required>
        <label for="subject">Konu</label>
        <input id="subject" name="subject" required>
        <label for="message">Mesaj</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button class="button" type="submit">E-posta taslağını aç</button>
      </form>
      <aside class="panel">
        <h2>E-posta adresim</h2>
        <p><a href="mailto:damlakayikci42@gmail.com">damlakayikci42@gmail.com</a></p>
      </aside>
    </div>
    <script>
      document.querySelector('#contact-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const fields = new FormData(event.currentTarget);
        const subject = encodeURIComponent(fields.get('subject'));
        const body = encodeURIComponent(fields.get('message') + '\r\n\r\n' + fields.get('name'));
        location.href = 'mailto:damlakayikci42@gmail.com?subject=' + subject + '&body=' + body;
      });
    </script>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Damla Kayıkcı</p>
      <p>Maskot görselleri yapay zekâyla üretildi.</p>
    </div>
  </footer>
</body>
</html>
